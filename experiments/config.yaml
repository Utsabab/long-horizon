# Configuration for TextQuests experiments
openrouter:
  model: "google/gemma-4-26b-a4b-it"
  base_url: "https://openrouter.ai/api/v1"
  request_timeout: 15
experiments:
  max_steps: 500
  autosave_every: 1
  accepted_local_error_k: 3
  info_seek_window: 10
  games: ["zork1", "wishbringer"]
logs:
  out_dir: "./experiments/logs"
scout:
  project: "textquests"
